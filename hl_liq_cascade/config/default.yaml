api:
  base_url: "https://api.hyperliquid.xyz"
  info_endpoint: "/info"
  ws_url: "wss://api.hyperliquid.xyz/ws"
  requests_per_second: 1
  max_retries: 10
  timeout_s: 30

data:
  cache_dir: "cache"
  position_snapshot_interval_h: 1
  top_n_addresses: 500
  history_months: 12
  parquet_compression: "zstd"

liq_map:
  bucket_pct: 0.001          # 0.1% price buckets
  density_window_pct: 0.005  # 0.5% window for density calc
  cluster_min_notional_usd: 100_000
  lookback_snapshots: 24     # hours of liq map history to keep hot

signals:
  weights:
    cascade_frontrun: 0.4
    postcascade_fade: 0.35
    squeeze: 0.25
  min_combined_score: 0.3    # |score| threshold to generate an entry

  cascade_frontrun:
    momentum_window_s: 60
    cluster_depth_pct: 0.005
    liq_imbalance_ratio: 3.0
    min_cluster_vol_fraction: 0.005  # cluster notional / 24h vol

  postcascade_fade:
    liq_window_s: 300
    liq_percentile_lookback_days: 30
    liq_percentile_threshold: 95
    decel_window_s: 60
    min_price_move_atr: 2.0

  squeeze:
    liq_depth_pct: 0.02
    liq_asymmetry_ratio: 5.0
    funding_extreme_threshold: 0.01  # 1% / 8h
    oi_growth_window_h: 4

execution:
  latency_ms: 200
  slippage_major_bps: 2      # BTC, ETH
  slippage_alt_bps: 5
  major_coins: ["BTC", "ETH"]
  maker_fill_rate: 0.60      # 60% fill on passive orders
  maker_timeout_s: 30        # convert to taker after 30s

risk:
  portfolio_risk_per_trade: 0.005   # 0.5%
  max_concurrent_positions: 3
  max_coin_exposure: 0.30           # 30% of equity
  hard_stop_pct: 0.03               # -3% adverse
  time_stop_h: 1.0
  correlation_cap: true
  correlated_coins:
    - ["SOL", "AVAX", "APT", "SUI", "SEI"]
    - ["BTC", "ETH"]
    - ["DOGE", "PEPE", "WIF", "BONK"]

backtest:
  start_date: "2024-01-01"
  end_date: "2025-05-01"
  oos_split: 0.75            # last 25% is OOS
  initial_capital: 100_000
  seed: 42

logging:
  level: "INFO"
  file: "logs/hl_liq_cascade.log"
  max_bytes: 10_485_760      # 10 MB
  backup_count: 5
